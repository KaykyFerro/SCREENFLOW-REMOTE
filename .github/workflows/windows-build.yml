name: Windows build and tests

concurrency:
  group: screenflow-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Download FFmpeg (LGPL)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-ffmpeg.ps1
      - name: Restore
        run: dotnet restore ScreenFlow.sln
      - name: Build Release
        run: dotnet build ScreenFlow.sln --configuration Release --no-restore
      - name: Run automated tests
        run: dotnet test ScreenFlow.sln --configuration Release --no-build --logger "trx;LogFileName=screenflow-tests.trx"
      - name: Publish self-contained Windows x64 app
        run: dotnet publish src/ScreenFlow.App/ScreenFlow.App.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/publish
      - name: Publish the ScreenFlow server for Windows (console, one file)
        run: dotnet publish src/ScreenFlow.Server/ScreenFlow.Server.csproj --configuration Release --runtime win-x64 --output artifacts/servidor-win-x64
      # O runner não tem placa de som. O VB-CABLE é uma placa de som virtual: com ela o Windows toca e captura som de
      # verdade, e o autoteste confere o som do PC separado por app. O Windows Server só carrega drivers com assinatura
      # antiga (de antes de 2015) ou certificados pela Microsoft, então vai o driver "win7" do pacote, de 2014. O devcon
      # (ferramenta da Microsoft que cria o dispositivo virtual) vem do pacote da Scream. Se nada instalar, o teste do
      # som é pulado e o passo do autoteste avisa.
      - name: Virtual sound card (for the PC sound self-test)
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 6
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "placa-virtual"
          New-Item -ItemType Directory -Force $dir | Out-Null
          function Get-Pinned([string]$Url, [string]$Sha256, [string]$Name) {
            $zip = Join-Path $dir "$Name.zip"
            Invoke-WebRequest $Url -OutFile $zip
            $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
            if ($hash -ne $Sha256) { throw "$Name.zip mudou: SHA-256 $hash (esperado $Sha256)." }
            $out = Join-Path $dir $Name
            Expand-Archive $zip -DestinationPath $out -Force
            return $out
          }
          $scream = Get-Pinned "https://github.com/duncanthrax/scream/releases/download/4.0/Scream4.0.zip" "FA33E25F9A46C61E4E0CD83362C51C3D2A45C6FE4091AAD7507E240E40F1A520" "scream"
          $cable = Get-Pinned "https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack46.zip" "BC44E8974191A5A2427D6C979E2DAB08DBB09925F3F435DFA2F0BA3E45B6EB90" "vbcable"
          $devcon = Join-Path $scream "Install\helpers\devcon-x64.exe"

          # Sem confiar no autor do driver, o Windows abre uma janela perguntando e a instalação fica parada nela.
          $store = [System.Security.Cryptography.X509Certificates.X509Store]::new("TrustedPublisher", "LocalMachine")
          $store.Open("ReadWrite")
          foreach ($file in "vbaudio_cable64_win7.cat", "vbaudio_cable64_win7.sys") {
            $signature = Get-AuthenticodeSignature (Join-Path $cable $file)
            Write-Host "Assinatura de ${file}: $($signature.Status), $($signature.SignerCertificate.Subject), $($signature.SignerCertificate.Thumbprint)"
            if (-not $signature.SignerCertificate) { throw "$file veio sem assinatura." }
            $store.Add($signature.SignerCertificate)
          }
          $store.Close()
          function Save-Desktop([string]$Path) {
            try {
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
              $bitmap = [System.Drawing.Bitmap]::new($bounds.Width, $bounds.Height)
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              New-Item -ItemType Directory -Force (Split-Path $Path) | Out-Null
              $bitmap.Save($Path, [System.Drawing.Imaging.ImageFormat]::Png)
              $graphics.Dispose()
              $bitmap.Dispose()
              Write-Host "Tela salva em $Path (vai junto nas capturas)."
            } catch { Write-Host "Não deu para salvar a tela: $($_.Exception.Message)" }
          }

          foreach ($name in "AudioEndpointBuilder", "Audiosrv") { Set-Service -Name $name -StartupType Automatic }
          $install = Start-Process -FilePath $devcon -ArgumentList @("install", "`"$(Join-Path $cable 'vbMmeCable64_win7.inf')`"", "VBAudioVACWDM") `
            -WorkingDirectory $cable -PassThru -NoNewWindow
          $null = $install.Handle
          if (-not $install.WaitForExit(120000)) {
            Save-Desktop (Join-Path $env:GITHUB_WORKSPACE "artifacts\capturas\ci-placa-de-som.png")
            Stop-Process -Id $install.Id -Force -ErrorAction SilentlyContinue
            throw "O devcon ficou parado (o Windows deve ter aberto uma janela pedindo confirmação)."
          }
          Write-Host "devcon terminou com código $($install.ExitCode) (0 = instalou, 1 = instalou e pede reiniciar)."
          # Reinicia o áudio do Windows para a saída nova aparecer na hora.
          foreach ($name in "AudioEndpointBuilder", "Audiosrv") { Restart-Service -Name $name -Force }
          Start-Sleep -Seconds 2
          Get-PnpDevice -Class MEDIA -ErrorAction SilentlyContinue | Format-Table Status, FriendlyName, InstanceId -AutoSize
          Get-PnpDevice -Class AudioEndpoint -ErrorAction SilentlyContinue | Format-Table Status, FriendlyName -AutoSize
          if ($install.ExitCode -gt 1) { throw "A instalação da placa de som virtual falhou (devcon $($install.ExitCode))." }
      - name: Smoke test (diagnostic command)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath artifacts/publish/ScreenFlow.exe -ArgumentList "--diagnostico" -PassThru -Wait -NoNewWindow
          $report = Get-ChildItem "$env:LOCALAPPDATA/ScreenFlow/logs/diagnostico-*.txt" | Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $report) { throw "O comando de diagnóstico não gerou relatório." }
          Get-Content $report
          if (-not (Select-String -Path $report -Pattern "FFmpeg n?7\.")) { throw "FFmpeg não carregou no app publicado." }
      - name: Self-test (music party, network room and PC sound per app)
        shell: pwsh
        run: |
          # Dois apps tocando fora do ScreenFlow para o teste do som do PC: 440 Hz no powershell.exe (o app que o teste
          # tira da transmissão) e 700 Hz no pwsh.exe (um app que continua nela e o único da festa com um app só). Sem
          # placa de som, eles só fecham.
          function New-ToneWav([string]$Path, [double]$Hz) {
            $rate = 48000
            $frames = $rate * 2
            $writer = [IO.BinaryWriter]::new([IO.File]::Create($Path))
            $writer.Write([Text.Encoding]::ASCII.GetBytes("RIFF"))
            $writer.Write([int](36 + $frames * 4))
            $writer.Write([Text.Encoding]::ASCII.GetBytes("WAVEfmt "))
            $writer.Write([int]16)
            $writer.Write([int16]1)
            $writer.Write([int16]2)
            $writer.Write([int]$rate)
            $writer.Write([int]($rate * 4))
            $writer.Write([int16]4)
            $writer.Write([int16]16)
            $writer.Write([Text.Encoding]::ASCII.GetBytes("data"))
            $writer.Write([int]($frames * 4))
            for ($i = 0; $i -lt $frames; $i++) {
              $sample = [int16][Math]::Round(8000 * [Math]::Sin(2 * [Math]::PI * $Hz * $i / $rate))
              $writer.Write($sample)
              $writer.Write($sample)
            }
            $writer.Dispose()
          }
          $player = Join-Path $env:RUNNER_TEMP "tocar-tom.ps1"
          Set-Content -Path $player -Encoding utf8 -Value @'
          param([string]$Wav)
          Add-Type -Namespace Som -Name Tocar -MemberDefinition '[DllImport("winmm.dll", CharSet = CharSet.Unicode)] public static extern bool PlaySound(string sound, IntPtr module, uint flags);'
          # SND_FILENAME | SND_LOOP | SND_NODEFAULT | SND_ASYNC
          if (-not [Som.Tocar]::PlaySound($Wav, [IntPtr]::Zero, 0x2000B)) { exit 1 }
          Start-Sleep -Seconds 900
          '@
          $players = foreach ($tone in @(@{ Exe = "powershell.exe"; Hz = 440 }, @{ Exe = "pwsh.exe"; Hz = 700 })) {
            $wav = Join-Path $env:RUNNER_TEMP "tom-$($tone.Hz).wav"
            New-ToneWav $wav $tone.Hz
            $process = Start-Process -FilePath $tone.Exe -ArgumentList @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "`"$player`"", "-Wav", "`"$wav`"") -PassThru -WindowStyle Hidden
            $null = $process.Handle # guarda o handle para ler o código de saída depois
            [pscustomobject]@{ Exe = $tone.Exe; Hz = $tone.Hz; Process = $process }
          }
          Start-Sleep -Seconds 4
          foreach ($tone in $players) {
            $state = if ($tone.Process.HasExited) { "fechou (código $($tone.Process.ExitCode))" } else { "tocando" }
            Write-Host "$($tone.Hz) Hz no $($tone.Exe) (processo $($tone.Process.Id)): $state"
          }
          $p = Start-Process -FilePath artifacts/publish/ScreenFlow.exe -ArgumentList "--autoteste" -PassThru -Wait -NoNewWindow
          $players.Process | Stop-Process -Force -ErrorAction SilentlyContinue
          $report = Get-ChildItem "$env:LOCALAPPDATA/ScreenFlow/logs/autoteste-*.txt" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1
          if ($report) { Get-Content $report } else { Write-Host "Sem relatório do autoteste." }
          if ($report) {
            # Parte pulada ou incompleta (sem placa de som, por exemplo): aparece como aviso no resumo do CI.
            foreach ($match in Select-String -Path $report -Pattern "\] (Pulado|Aviso): ") {
              Write-Host "::warning title=Autoteste::$($match.Line -replace '^\[[^\]]*\] ', '')"
            }
          }
          if ($p.ExitCode -ne 0) {
            Get-Content (Get-ChildItem "$env:LOCALAPPDATA/ScreenFlow/logs/screenflow-*.log" | Sort-Object LastWriteTime | Select-Object -Last 1) -Tail 80
            throw "Autoteste falhou (código $($p.ExitCode))."
          }
      - name: Screenshots of every screen
        shell: pwsh
        run: |
          $out = Join-Path $PWD "artifacts/capturas"
          $p = Start-Process -FilePath artifacts/publish/ScreenFlow.exe -ArgumentList @("--capturas", "`"$out`"") -PassThru -Wait -NoNewWindow
          if (Test-Path $out) { Get-ChildItem $out | Format-Table Name, Length -AutoSize }
          if ($p.ExitCode -ne 0) {
            Get-Content (Get-ChildItem "$env:LOCALAPPDATA/ScreenFlow/logs/screenflow-*.log" | Sort-Object LastWriteTime | Select-Object -Last 1) -Tail 120
            throw "As capturas de tela falharam (código $($p.ExitCode))."
          }
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ScreenFlow-capturas
          path: artifacts/capturas/
          if-no-files-found: warn
          retention-days: 14
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler installer\ScreenFlow.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
      - name: Upload Windows x64 distribution
        uses: actions/upload-artifact@v4
        with:
          name: ScreenFlow-win-x64
          path: |
            artifacts/ScreenFlow-Setup-win-x64.exe
            artifacts/publish/
          if-no-files-found: error
          retention-days: 14
      - name: Upload the Windows server
        uses: actions/upload-artifact@v4
        with:
          name: ScreenFlow-Servidor-win-x64
          path: artifacts/servidor-win-x64/
          if-no-files-found: error
          retention-days: 14
