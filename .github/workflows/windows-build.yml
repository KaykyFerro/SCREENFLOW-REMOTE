name: Windows build and tests

concurrency:
  group: screenflow-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Download FFmpeg (LGPL)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-ffmpeg.ps1
      - name: Restore
        run: dotnet restore ScreenFlow.sln
      - name: Build Release
        run: dotnet build ScreenFlow.sln --configuration Release --no-restore
      - name: Run automated tests
        run: dotnet test ScreenFlow.sln --configuration Release --no-build --logger "trx;LogFileName=screenflow-tests.trx"
      - name: Publish self-contained Windows x64 app
        run: dotnet publish src/ScreenFlow.App/ScreenFlow.App.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/publish
      # O runner não tem placa de som. A Scream é uma placa de som virtual com driver assinado: com ela o Windows toca e
      # captura som de verdade, e o autoteste confere o som do PC separado por app. Se não instalar, esse teste é pulado.
      - name: Virtual sound card (for the PC sound self-test)
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 5
        run: |
          foreach ($name in "AudioEndpointBuilder", "Audiosrv") {
            Set-Service -Name $name -StartupType Automatic
            Start-Service -Name $name
          }
          try { Write-Host "Secure Boot: $(Confirm-SecureBootUEFI)" } catch { Write-Host "Secure Boot: não deu para ler ($($_.Exception.Message))" }
          $zip = Join-Path $env:RUNNER_TEMP "Scream4.0.zip"
          Invoke-WebRequest "https://github.com/duncanthrax/scream/releases/download/4.0/Scream4.0.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne "FA33E25F9A46C61E4E0CD83362C51C3D2A45C6FE4091AAD7507E240E40F1A520") { throw "O Scream4.0.zip baixado não é o esperado ($hash)." }
          $dir = Join-Path $env:RUNNER_TEMP "scream"
          Expand-Archive $zip -DestinationPath $dir -Force
          $driver = Join-Path $dir "Install\driver\x64"
          # Sem confiar no autor do driver, o Windows abre uma janela perguntando e a instalação trava.
          $cert = (Get-AuthenticodeSignature (Join-Path $driver "Scream.sys")).SignerCertificate
          if (-not $cert) { throw "O driver da Scream veio sem assinatura." }
          $store = [System.Security.Cryptography.X509Certificates.X509Store]::new("TrustedPublisher", "LocalMachine")
          $store.Open("ReadWrite")
          $store.Add($cert)
          $store.Close()
          Push-Location $driver
          & (Join-Path $dir "Install\helpers\devcon-x64.exe") install Scream.inf "*Scream"
          $code = $LASTEXITCODE
          Pop-Location
          Start-Sleep -Seconds 3
          Get-CimInstance Win32_SoundDevice | Format-Table Name, Status, ConfigManagerErrorCode -AutoSize
          # devcon: 0 = instalou, 1 = instalou mas pede reiniciar.
          if ($code -gt 1) { throw "A instalação da placa de som virtual falhou (devcon $code)." }
      - name: Smoke test (diagnostic command)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath artifacts/publish/ScreenFlow.exe -ArgumentList "--diagnostico" -PassThru -Wait -NoNewWindow
          $report = Get-ChildItem "$env:LOCALAPPDATA/ScreenFlow/logs/diagnostico-*.txt" | Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $report) { throw "O comando de diagnóstico não gerou relatório." }
          Get-Content $report
          if (-not (Select-String -Path $report -Pattern "FFmpeg n?7\.")) { throw "FFmpeg não carregou no app publicado." }
      - name: Self-test (music party, network room and PC sound per app)
        shell: pwsh
        run: |
          # Dois apps tocando fora do ScreenFlow para o teste do som do PC: 440 Hz no powershell.exe (o app que o teste
          # tira da transmissão) e 700 Hz no pwsh.exe (um app que continua nela). Sem placa de som, eles só fecham.
          function New-ToneWav([string]$Path, [double]$Hz) {
            $rate = 48000
            $frames = $rate * 2
            $writer = [IO.BinaryWriter]::new([IO.File]::Create($Path))
            $writer.Write([Text.Encoding]::ASCII.GetBytes("RIFF"))
            $writer.Write([int](36 + $frames * 4))
            $writer.Write([Text.Encoding]::ASCII.GetBytes("WAVEfmt "))
            $writer.Write([int]16)
            $writer.Write([int16]1)
            $writer.Write([int16]2)
            $writer.Write([int]$rate)
            $writer.Write([int]($rate * 4))
            $writer.Write([int16]4)
            $writer.Write([int16]16)
            $writer.Write([Text.Encoding]::ASCII.GetBytes("data"))
            $writer.Write([int]($frames * 4))
            for ($i = 0; $i -lt $frames; $i++) {
              $sample = [int16][Math]::Round(8000 * [Math]::Sin(2 * [Math]::PI * $Hz * $i / $rate))
              $writer.Write($sample)
              $writer.Write($sample)
            }
            $writer.Dispose()
          }
          $player = Join-Path $env:RUNNER_TEMP "tocar-tom.ps1"
          Set-Content -Path $player -Encoding utf8 -Value @'
          param([string]$Wav)
          Add-Type -Namespace Som -Name Tocar -MemberDefinition '[DllImport("winmm.dll", CharSet = CharSet.Unicode)] public static extern bool PlaySound(string sound, IntPtr module, uint flags);'
          # SND_FILENAME | SND_LOOP | SND_NODEFAULT | SND_ASYNC
          if (-not [Som.Tocar]::PlaySound($Wav, [IntPtr]::Zero, 0x2000B)) { exit 1 }
          Start-Sleep -Seconds 900
          '@
          $players = foreach ($tone in @(@{ Exe = "powershell.exe"; Hz = 440 }, @{ Exe = "pwsh.exe"; Hz = 700 })) {
            $wav = Join-Path $env:RUNNER_TEMP "tom-$($tone.Hz).wav"
            New-ToneWav $wav $tone.Hz
            $process = Start-Process -FilePath $tone.Exe -ArgumentList @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "`"$player`"", "-Wav", "`"$wav`"") -PassThru -WindowStyle Hidden
            $null = $process.Handle # guarda o handle para ler o código de saída depois
            [pscustomobject]@{ Exe = $tone.Exe; Hz = $tone.Hz; Process = $process }
          }
          Start-Sleep -Seconds 4
          foreach ($tone in $players) {
            $state = if ($tone.Process.HasExited) { "fechou (código $($tone.Process.ExitCode))" } else { "tocando" }
            Write-Host "$($tone.Hz) Hz no $($tone.Exe) (processo $($tone.Process.Id)): $state"
          }
          $p = Start-Process -FilePath artifacts/publish/ScreenFlow.exe -ArgumentList "--autoteste" -PassThru -Wait -NoNewWindow
          $players.Process | Stop-Process -Force -ErrorAction SilentlyContinue
          $report = Get-ChildItem "$env:LOCALAPPDATA/ScreenFlow/logs/autoteste-*.txt" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1
          if ($report) { Get-Content $report } else { Write-Host "Sem relatório do autoteste." }
          if ($p.ExitCode -ne 0) {
            Get-Content (Get-ChildItem "$env:LOCALAPPDATA/ScreenFlow/logs/screenflow-*.log" | Sort-Object LastWriteTime | Select-Object -Last 1) -Tail 80
            throw "Autoteste falhou (código $($p.ExitCode))."
          }
      - name: Screenshots of every screen
        shell: pwsh
        run: |
          $out = Join-Path $PWD "artifacts/capturas"
          $p = Start-Process -FilePath artifacts/publish/ScreenFlow.exe -ArgumentList @("--capturas", "`"$out`"") -PassThru -Wait -NoNewWindow
          if (Test-Path $out) { Get-ChildItem $out | Format-Table Name, Length -AutoSize }
          if ($p.ExitCode -ne 0) {
            Get-Content (Get-ChildItem "$env:LOCALAPPDATA/ScreenFlow/logs/screenflow-*.log" | Sort-Object LastWriteTime | Select-Object -Last 1) -Tail 120
            throw "As capturas de tela falharam (código $($p.ExitCode))."
          }
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ScreenFlow-capturas
          path: artifacts/capturas/
          if-no-files-found: warn
          retention-days: 14
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler installer\ScreenFlow.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
      - name: Upload Windows x64 distribution
        uses: actions/upload-artifact@v4
        with:
          name: ScreenFlow-win-x64
          path: |
            artifacts/ScreenFlow-Setup-win-x64.exe
            artifacts/publish/
          if-no-files-found: error
          retention-days: 14
