name: Windows build and tests

concurrency:
  group: screenflow-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ScreenFlowRemote.sln
      - name: Build Release
        run: dotnet build ScreenFlowRemote.sln --configuration Release --no-restore
      - name: Run automated tests
        run: dotnet test ScreenFlowRemote.sln --configuration Release --no-build --logger "trx;LogFileName=screenflow-tests.trx"
      - name: Publish self-contained Windows x64 app
        run: dotnet publish src/ScreenFlow.Remote/ScreenFlow.Remote.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/publish
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found at $compiler" }
          & $compiler installer\ScreenFlowRemote.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
      - name: Upload Windows x64 distribution
        uses: actions/upload-artifact@v4
        with:
          name: ScreenFlow-Remote-win-x64
          path: |
            artifacts/ScreenFlowRemote-Setup-win-x64.exe
            artifacts/publish/
          if-no-files-found: error
          retention-days: 14
